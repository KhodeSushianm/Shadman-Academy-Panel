<script id="remove-legacy-demo-data">
(function(){
  try{
    const keyCandidates = [
      'shima-academy-db','shima-academy-sqlite','shimaAcademyDB',
      'shima_academy_db','shima-academy-database'
    ];
    if(!localStorage.getItem('shima_empty_mvp_reset_v2')){
      keyCandidates.forEach(k=>localStorage.removeItem(k));
      Object.keys(localStorage).forEach(k=>{
        if(/shima.*(db|sqlite|academy)/i.test(k)) localStorage.removeItem(k);
      });
      localStorage.setItem('shima_empty_mvp_reset_v2','1');
    }
  }catch(e){}
})();
</script>

<style id="visual-polish">
/* ===== Shima Academy visual polish ===== */
:root{
  --sa-radius:16px;
  --sa-radius-sm:12px;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-width:320px;

button,input,select,textarea{font:inherit}

/* App shell */
.app,.layout,.shell{min-height:100vh}
.sidebar{
  z-index:50;
  box-shadow:8px 0 28px rgba(15,23,42,.04);
}
.main,.content,.page-content{min-width:0}

  position:sticky;
  top:0;
  z-index:35;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

/* Cards */
.card,.stat-card,.panel,.table-card,.chart-card,.activity-card{
  border-radius:var(--sa-radius);
  box-shadow:var(--sa-shadow);
}
.card:hover,.stat-card:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 35px rgba(15,23,42,.09);
}
.card,.stat-card{transition:transform .2s ease,box-shadow .2s ease}

/* Stats grid */
.stats-grid,.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}
.stat-card{min-width:0}

/* Tables */
.table-wrap,.table-container{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0}
th{white-space:nowrap;font-weight:700}
td{vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .16s ease}
tbody tr:hover{background:rgba(99,102,241,.035)}

/* Forms */
input,select,textarea{
  border-radius:11px;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#6366f1 !important;
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}
textarea{resize:vertical;min-height:100px}

/* Buttons */
.btn,.button{
  transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease;
}
.btn:hover,.button:hover{transform:translateY(-1px)}
.btn:active,.button:active{transform:translateY(0)}

/* Modal / drawer */
.modal-backdrop,.modal-overlay{
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.modal,.modal-content{
  max-width:min(680px,calc(100vw - 32px));
  max-height:calc(100vh - 32px);
  overflow:auto;
  border-radius:20px;
  box-shadow:var(--sa-shadow-lg);
}
.drawer{
  max-width:min(480px,92vw);
  overflow-y:auto;
  box-shadow:-20px 0 55px rgba(15,23,42,.16);
}

/* Empty states */
.empty-state{
  padding:44px 24px;
  text-align:center;
  color:var(--muted,#64748b);

/* Responsive */

  .stats-grid,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}

const STORAGE='shima-academy-sqlite-v1';
/* دسترسی به localStorage می‌تواند در برخی محیط‌ها (origin نامشخص، حالت
   خصوصی، یا سیاست‌های سخت‌گیرانه) همان‌جا SecurityError پرتاب کند.
   چون یکی از این فراخوانی‌ها در سطح بالای اسکریپت است، خطایش کل
   اسکریپت را می‌کُشت و صفحه سفید می‌شد. اکنون همه‌جا مهار شده است. */
const ls={
  get(k,d=null){try{return localStorage.getItem(k)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  keys(){try{return Object.keys(localStorage)}catch(e){return[]}}
};

/* ── تاریخ جلالی ─────────────────────────────────────────────
   پیش‌تر تاریخ‌ها در کد hard-code بودند (۱۴۰۵/۰۶/۲۴) و یادداشت‌ها
   با رشته‌ی تحت‌اللفظی «امروز» ذخیره می‌شدند؛ یعنی داده‌ها در زمان
   منجمد بودند و مرتب‌سازی تاریخچه بی‌معنی بود. */
function pad2(n){return String(n).padStart(2,'0')}
function jalaliOf(d){
 const r=window.jalaali.toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());
 return r.jy+'/'+pad2(r.jm)+'/'+pad2(r.jd);
}
function todayJalali(){
 try{return jalaliOf(new Date())}
 catch(e){
   console.error('[date] تبدیل جلالی ناموفق بود — به تاریخ میلادی برمی‌گردیم:',e);
   return new Date().toISOString().slice(0,10);
 }
}
function jalaliMonthPrefix(){const t=todayJalali();return t.slice(0,t.lastIndexOf('/'))}

const seedData = {students:[], plans:[], exams:[], notes:[]};

function b64ToBytes(b64){const bin=atob(b64),n=bin.length,out=new Uint8Array(n);for(let i=0;i<n;i++)out[i]=bin.charCodeAt(i);return out}
/* اگر بایت‌های WASM درون‌خطی در دسترس باشند (حالت Electron/file://) مستقیماً
   به initSqlJs داده می‌شوند تا هیچ fetch انجام نشود؛ در غیر این صورت — مثلاً
   وقتی پروژه روی یک وب‌سرور http باز شده — از مسیر محلی vendor خوانده می‌شود. */
function sqlJsConfig(){
 const cfg={locateFile:f=>'vendor/sql.js/'+f};
 if(typeof window!=='undefined'&&window.SQL_WASM_BASE64){
   try{cfg.wasmBinary=b64ToBytes(window.SQL_WASM_BASE64)}catch(e){console.error('[wasm] رمزگشایی base64 ناموفق بود، به حالت fetch برمی‌گردیم:',e)}
 }
 return cfg;
}
async function init(){
 SQL=await initSqlJs(sqlJsConfig());
 let saved=null;
 if(window.electronAPI){
   try{saved=await window.electronAPI.loadDatabase();}catch(e){console.error(e);}
   /* اولین اجرا: هنوز پوشه‌ای انتخاب نشده — از کاربر می‌پرسیم */
   if(!saved && typeof window.electronAPI.chooseInitialFolder==='function'){
     try{
       const picked=await window.electronAPI.chooseInitialFolder();
       if(picked && picked.folder) saved=await window.electronAPI.loadDatabase();
     }catch(e){console.error(e)}
   }
 }else saved=ls.get(STORAGE);
 if(saved){try{db=new SQL.Database(Uint8Array.from(atob(saved),c=>c.charCodeAt(0)));}catch(e){createDB();}} else createDB();
 migrate();
 render();
 lucide.createIcons();
 updateStorageInfo();
 if(migrationNotice)toast(migrationNotice,{duration:6000});
}
/* ── نسخه‌بندی schema و مهاجرت ─────────────────────────────────
   نسخه‌ی ساختار دیتابیس در خود SQLite نگه داشته می‌شود
   (PRAGMA user_version). هر تغییر آینده‌ی ساختار یک مهاجرت شماره‌دار
   است که به‌ترتیب و داخل تراکنش اجرا می‌شود؛ پس دیتابیس کاربران قدیمی
   بی‌صدا نمی‌شکند و تغییرات ساختاری قابل برگشت‌اند. */
const SCHEMA_VERSION=1;
const MIGRATIONS=[
 {version:1,up(d){
   d.run(`CREATE TABLE students(id INTEGER PRIMARY KEY,first_name TEXT,last_name TEXT,phone TEXT,grade TEXT,field TEXT,advisor TEXT,status TEXT,score INTEGER,progress INTEGER,created_at TEXT);
 CREATE TABLE plans(id INTEGER PRIMARY KEY,student_id INTEGER,date TEXT,subject TEXT,title TEXT,duration INTEGER,status TEXT);
 CREATE TABLE exams(id INTEGER PRIMARY KEY,student_id INTEGER,title TEXT,date TEXT,score INTEGER);
 CREATE TABLE notes(id INTEGER PRIMARY KEY,student_id INTEGER,text TEXT,date TEXT);`);
 }},
];
function schemaVersion(d){
 try{const r=d.exec('PRAGMA user_version');return (r.length&&r[0].values.length)?r[0].values[0][0]:0}catch(e){return 0}
}
function hasLegacyTables(d){
 try{const r=d.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='students'");return !!(r.length&&r[0].values.length)}catch(e){return false}
}
function runMigrations(d,fromVersion){
 for(const m of MIGRATIONS){
   if(m.version<=fromVersion)continue;
   d.run('BEGIN');
   try{m.up(d);d.run('PRAGMA user_version='+m.version);d.run('COMMIT')}
   catch(e){try{d.run('ROLLBACK')}catch(_){}throw e}
 }
}
let migrationNotice=null;
function createDB(){
 db=new SQL.Database();
 runMigrations(db,0);
 for(const s of seedData.students) db.run(`INSERT INTO students VALUES(?,?,?,?,?,?,?,?,?,?,?)`,[s.id,s.first_name,s.last_name,s.phone,s.grade,s.field,s.advisor,s.status,s.score,s.progress,todayJalali()]);
 for(const p of seedData.plans) db.run(`INSERT INTO plans VALUES(?,?,?,?,?,?,?)`,[p.id,p.student_id,p.date,p.subject,p.title,p.duration,p.status]);
 for(const e of seedData.exams) db.run(`INSERT INTO exams VALUES(?,?,?,?,?)`,[e.id,e.student_id,e.title,e.date,e.score]);
 for(const n of seedData.notes) db.run(`INSERT INTO notes VALUES(?,?,?,?)`,[n.id,n.student_id,n.text,n.date]);
 persist();
}
function migrate(){
 const v=schemaVersion(db);
 if(v===0){
   /* دیتابیس قدیمیِ پیش از نسخه‌بندی: جدول‌ها هست، فقط مُهر ندارد */
   if(hasLegacyTables(db)){try{db.run('PRAGMA user_version='+SCHEMA_VERSION)}catch(e){console.error('[migrate] مُهر نسخه ناموفق:',e)}}
   else runMigrations(db,0);
 }else if(v<SCHEMA_VERSION){
   runMigrations(db,v);
 }else if(v>SCHEMA_VERSION){
   /* فایلِ نسخه‌ی جدیدتر برنامه: دست نمی‌زنیم تا داده خراب نشود */
   migrationNotice='این فایل با نسخه‌ی جدیدتری از برنامه ساخته شده است؛ برای جلوگیری از خرابی داده، بدون تغییر باز شد.';
 }
 persist();
}
function dbBase64(){const data=db.export();let s='';for(let i=0;i<data.length;i+=0x8000)s+=String.fromCharCode(...data.subarray(i,i+0x8000));return btoa(s)}
let persistTimer=null;
/* نوشتن کامل فایل روی هر تغییر، هم کند است و هم پنجره‌ی خرابی فایل را بزرگ می‌کند.
   تغییرات پیاپی در یک نوشتن ادغام می‌شوند و پیش از بستن صفحه flushed می‌شوند. */
function persist(){clearTimeout(persistTimer);persistTimer=setTimeout(persistNow,400)}
function persistNow(){
 clearTimeout(persistTimer);persistTimer=null;
 if(!db)return;
 try{
  const value=dbBase64();
  if(window.electronAPI) window.electronAPI.saveDatabase(value).then(r=>{if(r&&!r.ok)console.error('[db] ذخیره‌سازی ناموفق:',r.reason,r.message||'')}).catch(console.error);
  else ls.set(STORAGE,value);
 }catch(e){console.error('[db] خطا در persist:',e)}
}
function flushPersist(){if(persistTimer)persistNow()}
window.addEventListener('beforeunload',flushPersist);
window.addEventListener('pagehide',flushPersist);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPersist()});
function q(sql,params=[]){const r=db.exec(sql,params);if(!r.length)return[];return r[0].values.map(v=>Object.fromEntries(r[0].columns.map((c,i)=>[c,v[i]])))}
function one(sql,p=[]){return q(sql,p)[0]}
function nextId(table){return (one(`SELECT COALESCE(MAX(id),0)+1 n FROM ${table}`)?.n)||1}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){return Number(n||0).toLocaleString('fa-IR')}
function initials(s){return (s.first_name||'').charAt(0)+(s.last_name||'').charAt(0)}
function studentName(s){return `${s.first_name} ${s.last_name}`}
function statusHtml(s){let map={active:['فعال','active'],warning:['نیاز به پیگیری','warning'],inactive:['غیرفعال','inactive']};let x=map[s]||map.active;return `<span class="status ${x[1]}">${x[0]}</span>`}

 const avg=Math.round(one('SELECT COALESCE(AVG(score),0) n FROM exams WHERE score IS NOT NULL').n);
 const plans=one("SELECT COUNT(*) n FROM plans WHERE status='pending'").n;
 const monthPrefix=jalaliMonthPrefix();
 const newThisMonth=one('SELECT COUNT(*) n FROM students WHERE substr(created_at,1,length(?))=?',[monthPrefix,monthPrefix]).n;
 const acts=q(`SELECT s.first_name,s.last_name,p.subject,p.status,p.date FROM plans p JOIN students s ON s.id=p.student_id ORDER BY p.id DESC LIMIT 5`);
 return `<div class="page">
 <section class="page-head"><div><div class="eyebrow">OVERVIEW</div><h1 class="title">صبح بخیر، شیما 👋</h1><div class="desc">وضعیت کلی آکادمی را در یک نگاه بررسی کنید.</div></div><button class="primary" onclick="openStudentModal()"><i data-lucide="plus"></i>دانش‌آموز جدید</button></section>
 <section class="stats">
 ${stat('کل دانش‌آموزان',fmt(total),'users',fmt(newThisMonth)+' دانش‌آموز جدید این ماه')}
 ${stat('دانش‌آموزان فعال',fmt(active),'user-check',Math.round(active/Math.max(total,1)*100)+'٪ از کل')}
 ${stat('میانگین تراز',fmt(avg),'trending-up','↑ روند کلی مثبت','blue')}
 ${stat('برنامه‌های در انتظار',fmt(plans),'calendar-clock','برای پیگیری امروز','yellow')}
 </section>
 <section class="grid">
 <div class="card"><div class="card-head"><div><div class="card-title">روند عملکرد دانش‌آموزان</div><div class="card-sub">میانگین تراز آزمون‌های اخیر</div></div></div>${chart()}</div>
 <div class="card"><div class="card-head"><div><div class="card-title">فعالیت‌های اخیر</div><div class="card-sub">آخرین تغییرات سیستم</div></div></div><div class="activity">${acts.map(a=>`<div class="act"><div class="act-avatar">${esc((a.first_name||'').charAt(0))}</div><div class="act-main"><div class="act-name">${esc(a.first_name+' '+a.last_name)}</div><div class="act-text">${a.status==='done'?'برنامه '+esc(a.subject)+' را تکمیل کرد':'برنامه '+esc(a.subject)+' در انتظار انجام است'}</div></div><div class="act-time">${esc(a.date)}</div></div>`).join('')}</div></div>
 </section>
 <section class="card table-card"><div class="card-head"><div><div class="card-title">دانش‌آموزان</div><div class="card-sub">آخرین دانش‌آموزان مرکز</div></div><button class="link-btn" onclick="currentPage='students';render()">مشاهده همه ←</button></div>${studentTable(q('SELECT * FROM students ORDER BY id DESC LIMIT 5'))}</section>
 </div>`;
}
function stat(label,num,icon,foot,kind){
 let c=kind==='yellow'?'color:#fcd34d;background:#fbbf2410':kind==='blue'?'color:#93c5fd;background:#60a5fa10':'';
 return `<div class="stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon" style="${c}"><i data-lucide="${icon}"></i></span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`;
}
function chart(){
 const rows=q(`SELECT title, date, AVG(score) avg_score
               FROM exams
               WHERE score IS NOT NULL AND score <> ''
               GROUP BY title, date
               ORDER BY date DESC, id DESC
               LIMIT 7`).reverse();
 if(!rows.length){
   return `<div class="chart-box"><div class="average-chart-empty"><strong>هنوز داده‌ای برای نمایش وجود ندارد</strong><span>بعد از ثبت نتیجه آزمون، میانگین تراز در این نمودار نمایش داده می‌شود.</span></div></div>`;
 }
 const pts=rows.map(r=>Number(r.avg_score)||0);
 const max=Math.max(...pts), min=Math.min(...pts);
 const pad=Math.max((max-min)*.18,100);
 const hi=max+pad, lo=Math.max(0,min-pad);
 const w=700,h=180;
 const p=pts.map((v,i)=>{
   const x=rows.length===1?w/2:i*(w/(rows.length-1));
   const y=h-18-((v-lo)/(hi-lo))*135;
   return `${x},${y}`;
 }).join(' ');
 const area=`0,180 ${p} 700,180`;
 const latest=pts[pts.length-1];
 const labels=rows.map(r=>`<span>${esc(r.title||'آزمون')}</span>`).join('');
 return `<div class="chart-box"><div style="font-size:23px;font-weight:800">${fmt(Math.round(latest))}</div><div class="chart"><svg viewBox="0 0 700 180" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aaa095" stop-opacity=".18"/><stop offset="1" stop-color="#aaa095" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#g)"/><polyline points="${p}" fill="none" stroke="#aaa095" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="chart-labels" style="grid-template-columns:repeat(${rows.length},1fr)">${labels}</div></div>`;
}
function studentTable(rows){
 if(!rows.length)return `<div class="empty"><i data-lucide="graduation-cap"></i><div>هنوز دانش‌آموزی ثبت نشده است.</div></div>`;
 return `<div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>پایه / رشته</th><th>مشاور</th><th>تراز</th><th>پیشرفت</th><th>وضعیت</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td onclick="openDrawer(${s.id})" style="cursor:pointer"><div class="student"><div class="avatar">${esc(initials(s))}</div><div><b>${esc(studentName(s))}</b><div class="small">${esc(s.phone)}</div></div></div></td><td>${esc(s.grade)} • ${esc(s.field)}</td><td>${esc(s.advisor||'—')}</td><td><b>${fmt(s.score)}</b></td><td><div class="progress"><i style="width:${s.progress||0}%"></i></div></td><td>${statusHtml(s.status)}</td><td><div class="row-actions"><button class="row-btn" title="ویرایش" onclick="openStudentModal(${s.id})"><i data-lucide="pencil"></i></button><button class="row-btn" title="حذف" onclick="deleteStudent(${s.id})"><i data-lucide="trash-2"></i></button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function studentsPage(){
 return `<div class="page"><section class="page-head"><div><div class="eyebrow">STUDENTS</div><h1 class="title">دانش‌آموزان</h1><div class="desc">مدیریت اطلاعات و وضعیت دانش‌آموزان مرکز.</div></div><button class="primary" onclick="openStudentModal()"><i data-lucide="plus"></i>افزودن دانش‌آموز</button></section><div class="card section-card"><div class="card-head"><div class="toolbar"><input id="studentSearch" class="search" placeholder="جستجوی نام، شماره یا رشته..." oninput="filterStudents(this.value)"><select class="filter" id="studentStatus" onchange="filterStudents(document.getElementById('studentSearch').value)"><option value="">همه وضعیت‌ها</option><option value="active">فعال</option><option value="warning">نیاز به پیگیری</option><option value="inactive">غیرفعال</option></select></div></div><div id="studentsTable">${studentTable(q('SELECT * FROM students ORDER BY id DESC'))}</div></div></div>`;

}

function saveStudent(){
 const first=f('fFirst'),last=f('fLast');if(!first||!last)return toast('نام و نام خانوادگی الزامی است');
 const data=[first,last,f('fPhone'),f('fGrade'),f('fField'),f('fAdvisor'),f('fStatus'),Number(f('fScore'))||0,Math.max(0,Math.min(100,Number(f('fProgress'))||0))];
 if(editingId)db.run('UPDATE students SET first_name=?,last_name=?,phone=?,grade=?,field=?,advisor=?,status=?,score=?,progress=? WHERE id=?',[...data,editingId]);
 else db.run('INSERT INTO students VALUES(?,?,?,?,?,?,?,?,?,?,?)',[nextId('students'),...data,todayJalali()]);
 persist();closeModal();render();toast('دانش‌آموز ذخیره شد');
}
/* تراز دانش‌آموز = میانگین واقعی همه‌ی آزمون‌هایش.
   پیش‌تر با «آخرین» آزمون بازنویسی می‌شد، در حالی که داشبورد آن را
   «میانگین تراز» معرفی می‌کرد — یعنی عدد نمایش‌داده‌شده دروغ بود. */
function recalcStudentScore(sid){
 if(sid==null)return;
 db.run('UPDATE students SET score=(SELECT COALESCE(ROUND(AVG(score)),0) FROM exams WHERE student_id=?) WHERE id=?',[sid,sid]);
}

function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2200)}

async function chooseStorageFolder(){
 if(!window.electronAPI){toast('انتخاب پوشه فقط در نسخه دسکتاپ فعال است');return}
 try{
   const result=await window.electronAPI.chooseFolder();
   if(result?.cancelled)return;
   if(result?.data){try{db=new SQL.Database(Uint8Array.from(atob(result.data),c=>c.charCodeAt(0)));migrate();render();toast('دیتابیس موجود از پوشه انتخاب‌شده بارگذاری شد');}
   catch(e){toast('فایل دیتابیس قابل خواندن نبود')}}
   else persist();
   updateStorageInfo();
 }catch(e){console.error(e);toast('انتخاب پوشه انجام نشد')}
}
async function updateStorageInfo(){
 const el=document.getElementById('storageInfo'); if(!el)return;
 if(window.electronAPI){
   const info=await window.electronAPI.getStorageInfo();
   if(!info||!info.folder){el.textContent='هنوز پوشه‌ای انتخاب نشده است. برای شروع، روی «انتخاب پوشه» بزنید.';}
   else{
     const kb=info.size!=null?(info.size/1024).toLocaleString('fa-IR',{maximumFractionDigits:1}):'—';
     const src=info.source==='backup'
       ?'<div class="note" style="margin-top:10px;border-color:rgba(180,161,111,.4)">⚠ فایل اصلی خوانده نشد؛ داده‌ها از <b>نسخه‌ی پشتیبان</b> بازیابی شد. لطفاً یک خروجی بگیرید.</div>'
       :'';
     el.innerHTML=`<div><b style="color:var(--text)">پوشه فعلی:</b> ${esc(info.folder)}</div>`
       +`<div style="margin-top:6px">فایل دیتابیس: <b style="color:var(--text)">shima-academy.sqlite</b> — ${kb} کیلوبایت</div>`
       +`<div style="margin-top:6px">نسخه‌ی پشتیبان خودکار: ${info.backupExists?'<b style="color:var(--green)">فعال</b> (shima-academy.sqlite.bak)':'<span style="color:var(--muted)">هنوز ساخته نشده</span>'}</div>`
       +src;
   }
 }
 else el.textContent='حالت مرورگر: اطلاعات در localStorage همین مرورگر نگهداری می‌شود.';
 lucide.createIcons();
}
function exportDB(){const a=db.export();let blob=new Blob([a],{type:'application/x-sqlite3'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='shima-academy.sqlite';el.click();URL.revokeObjectURL(url);toast('فایل SQLite ساخته شد') }
function resetDB(){if(!confirm('همه‌ی داده‌ها برای همیشه حذف شوند؟\n\nاین عمل قابل بازگشت نیست. پیشنهاد می‌شود پیش از ادامه، با «خروجی دیتابیس» یک پشتیبان بگیرید.'))return;createDB();render();toast('داده‌ها بازنشانی شدند')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}});
if(ls.get('shima-theme')==='light')document.body.classList.add('light');
init();
</script>

<script id="visual-polish-script">
(function(){
  const fix = () => {
    const sidebar = document.querySelector('.sidebar');

    if(!sidebar || !topbar || document.querySelector('[data-mobile-menu]')) return;

    topbar.prepend(b);
    const style=document.createElement('style');
    style.textContent='@media(max-width:640px){[data-mobile-menu]{display:grid!important;place-items:center}.sidebar.sa-open{width:250px!important;min-width:250px!important;overflow:auto!important;position:fixed!important;right:0!important;top:0!important;bottom:0!important;background:var(--card,#fff);z-index:100;box-shadow:-12px 0 35px rgba(15,23,42,.18)}.sidebar.sa-open .brand-text,.sidebar.sa-open .nav-label,.sidebar.sa-open .user-meta,.sidebar.sa-open .logout-label{display:initial!important}.sidebar.sa-open .nav-item{justify-content:flex-start!important}}';
    document.head.appendChild(style);
    b.onclick=()=>sidebar.classList.toggle('sa-open');
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix); else fix();
})();
</script>


<script id="dynamic-average-score-chart">
(function(){
  function renderEmptyChartIfNeeded(){
    // Remove hard-coded dashboard chart points/labels left by the original mock UI.
    // The actual dashboard renderer should calculate this from SQLite.
    document.querySelectorAll('[data-mock-chart]').forEach(el=>el.remove());
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',renderEmptyChartIfNeeded);
  else renderEmptyChartIfNeeded();
})();
</script>
</body>
